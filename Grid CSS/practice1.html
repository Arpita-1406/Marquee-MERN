<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Grid Layout</title>
<link rel="stylesheet" href="style.css">
<style>
    body{

   
    justify-content:center;
    align-items:center;
    height:100vh;
    width: 100vh;
    
}

.grid-container{
    width:800px;
    height:400px;

    display:grid;

    grid-template-columns: 1fr 1fr 1fr 1fr;
   
   

    gap:10px;
}

.box{
    height: 20vh;
    width: 20vh;
    justify-content:center;
    align-items:center;
    font-size:25px;
    color:white;
    font-weight:bold;
}


.box1{
    background:lime;
    grid-row:1 / span 4;
}


.box2{
    background:lime;
    grid-column:2 / 4;
}


.box3{
    background:red;
}


.box4{
    background: rgb(255, 208, 0);
}

.box5{
    background:red;
}


.box6{
    background:red;
}

.box7{
    background:rgb(255, 208, 0);
}


.box8{
    background:lime;
    grid-column:4;
    grid-row: 2/span 4;
}
</style>
</head>
<body>

<div class="grid-container">
    <div class="box box1">1</div>
    <div class="box box2">2</div>
    <div class="box box3">3</div>
    <div class="box box4">4</div>
    <div class="box box5">5</div>
    <div class="box box6">6</div>
    <div class="box box7">7</div>
    <div class="box box8">8</div>
</div>

</body>
</html>
