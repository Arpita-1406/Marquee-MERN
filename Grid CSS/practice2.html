<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

       body{

   
    justify-content:center;
    align-items:center;
    height:100vh;
    width: 100vh;
    
}

.grid-container{
    width:800px;
    height:400px;

    display:grid;

    grid-template-columns: 1fr 1fr 1fr ;
   
   

    gap:10px;
}

.box{
    height: 20vh;
    width: 20vh;
    justify-content:center;
    align-items:center;
    font-size:25px;
    color:white;
    font-weight:bold;
}


.box1{
    background:lime;
    grid-row:1 / span 3;
}


.box2{
    background:lime;
    grid-row:2 / 3;
}


.box3{
    background:red;
    grid-template-columns: 2/3;
}


.box4{
    background: rgb(255, 208, 0);
}

.box5{
    background:red;
}


.box6{
    background:red;
} 
    </style>
</head>
<body>
    <div class="grid-container">
    <div class="box box1">Header</div>
    <div class="box box2">Sidebar</div>
    <div class="box box3">content1</div>
    <div class="box box4">Content2</div>
    <div class="box box5">Content3</div>
    <div class="box box6">Content4</div>
    
</div>
</body>
</html>
