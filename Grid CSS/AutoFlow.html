<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nature Gallery</title>
    <link rel="stylesheet" href="style.css">
    <style>
        *{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f5f5f5;
    font-family:Arial, sans-serif;
}

.gallery{
    width:90%;
    max-width:1000px;
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:12px;
    padding:20px;
    background:white;
    border-radius:12px;
}

.card{
    overflow:hidden;
    border-radius:12px;
}

.card img{
    width:100%;
    height:180px;
    object-fit:cover;
    display:block;
    transition:transform 0.3s ease;
}

.card img:hover{
    transform:scale(1.05);
}
    </style>
</head>
<body>

<div class="gallery">
    <div class="card">
        <img src="https://picsum.photos/300/300?random=1" alt="">
    </div>
    <div class="card">
        <img src="https://picsum.photos/300/300?random=2" alt="">
    </div>
    <div class="card">
        <img src="https://picsum.photos/300/300?random=3" alt="">
    </div>
    <div class="card">
        <img src="https://picsum.photos/300/300?random=4" alt="">
    </div>
    <div class="card">
        <img src="https://picsum.photos/300/300?random=5" alt="">
    </div>
    <div class="card">
        <img src="https://picsum.photos/300/300?random=6" alt="">
    </div>
    <div class="card">
        <img src="https://picsum.photos/300/300?random=7" alt="">
    </div>
    <div class="card">
        <img src="https://picsum.photos/300/300?random=8" alt="">
    </div>
</div>
</body>
</html>
