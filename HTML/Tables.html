<!-- Q1. What is a table in HTML?

A table is used to organize data into rows and columns using the <table> tag.

Q2. What is the difference between <th> and <td>?
<th> = Table Heading (bold and centered by default)
<td> = Table Data (normal cell data)
Q3. What is <tr>?

<tr> is used to create a table row.

Q4. What is colspan?

colspan is used to merge two or more columns.

Q5. What is rowspan?

rowspan is used to merge two or more rows. -->

<!DOCTYPE html>
<html>
<body>

<table border="1">
    <caption>Student Details</caption>
    <tr>
        <th colspan="3">Student Details</th>
    </tr>

    <tr>
        <th>Name</th>
        <th>Age</th>
        <th>City</th>
    </tr>

    <tr>
        <td>Arpita</td>
        <td>20</td>
        <td>Vadodara</td>
    </tr>

    <tr>
        <td>Rahul</td>
        <td>21</td>
        <td>Ahmedabad</td>
    </tr>
</table>

</body>
</html>
