<!-- Forms--An HTML Form is used to collect data from users, such as name, email, password, phone number, etc.
The form is created using the <form> tag. -->

    <!DOCTYPE html>
<html>
<body>

<h2>Student Registration Form</h2>

<form>
    Name:
    <input type="text"><br><br>

    Email:
    <input type="email"><br><br>

    Password:
    <input type="password"><br><br>

    <input type="submit" value="Submit">
</form>

<!-- Common Form Elements

1. Text Field:- <input type="text">
Used to enter text.

2. Password Field:- <input type="password">
Hides the entered characters.

3. Email Field:- <input type="email">
Accepts email addresses.

4. Radio Button:- Used when only one option can be selected.
Gender:
<input type="radio" name="gender"> Male
<input type="radio" name="gender"> Female

5. Checkbox:- Used when multiple options can be selected.
Skills:
<input type="checkbox"> HTML
<input type="checkbox"> CSS
<input type="checkbox"> Java

6. Submit Button:- <input type="submit" value="Submit">
Sends the form data.

7. Reset Button:- <input type="reset" value="Reset">
Clears all form fields.

8. Textarea:- Used for multi-line text.
<textarea rows="4" cols="30"></textarea>

9. Dropdown List
<select>
    <option>B.Tech</option>
    <option>BCA</option>
    <option>B.Sc</option>
</select> -->

<h2>Student Registration Form</h2>

<form>

    Name:
    <input type="text"><br><br>

    Email:
    <input type="email"><br><br>

    Password:
    <input type="password"><br><br>

    Gender:
    <input type="radio" name="gender"> Male
    <input type="radio" name="gender"> Female
    <br><br>

    Skills:
    <input type="checkbox"> HTML
    <input type="checkbox"> CSS
    <input type="checkbox"> Java
    <br><br>

    Course:
    <select>
        <option>B.Tech</option>
        <option>BCA</option>
        <option>B.Sc</option>
    </select>
    <br><br>

    Address:
    <textarea rows="4" cols="30"></textarea>
    <br><br>

    <input type="submit" value="Submit">
    <input type="reset" value="Reset">

</form>

</body>
</html>
