<!--  Semantic Tags in HTML

Semantic tags clearly describe the meaning of the content they contain.

Examples:

<header>
<nav>
<main>
<section>
<article>
<aside>
<footer>

Advantages:

Easy to understand the code.
Better SEO (Search Engine Optimization).
Helps screen readers and accessibility.
Improves code readability. -->
<header>
    <h1>My Portfolio</h1>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">Projects</a>
</nav>

<main>
    <section>
        <h2>About Me</h2>
        <p>I am a CSE student.</p>
    </section>
</main>

<footer>
    <p>Copyright 2026</p>
</footer>



<!--Non-Semantic Tags in HTML

Non-semantic tags do not tell anything about the content they contain.

Examples:

<div>
<span> -->

    <div>
    <h1>My Portfolio</h1>
</div>

<div>
    <a href="#">Home</a>
</div>

<div>
    <p>I am a CSE student.</p>
</div>

<!-- Q: What is the difference between div and span?

Answer:
<div> is a block-level container that occupies the full width and starts on a new line, whereas <span> is an inline container that occupies only the necessary width and remains on the same line. -->

<div style="border:1px solid black;">
    <h2>Portfolio</h2>
    <p>
        I am learning
        <span style="color:blue;">HTML</span>.
    </p>
</div>

<!-- Q: What are the levels of HTML elements?

Answer:
HTML elements are of two types:

Block-level elements – start on a new line and occupy full width (e.g., <div>, <p>, <h1>).
Inline elements – do not start on a new line and occupy only the required width (e.g., <span>, <a>, <b>). -->
